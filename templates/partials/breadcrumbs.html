<nav class="breadcrumbs" aria-label="Breadcrumb">
  <ol>
    {% for crumb in breadcrumbs %}
    <li>{% if not loop.last %}<a href="{{ url(crumb.url) }}">{{ crumb.name }}</a><span class="crumb-sep" aria-hidden="true">/</span>{% else %}<span aria-current="page">{{ crumb.name }}</span>{% endif %}</li>
    {% endfor %}
  </ol>
</nav>
